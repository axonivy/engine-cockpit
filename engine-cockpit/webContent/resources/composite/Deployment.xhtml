<html xmlns="http://www.w3.org/1999/xhtml" xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html" xmlns:ui="jakarta.faces.facelets"
  xmlns:cc="jakarta.faces.composite" xmlns:ic="http://ivyteam.ch/jsf/component"
  xmlns:p="primefaces">
<cc:interface>
  <cc:attribute name="onClose" method-signature="void handleEvent()" required="true"
    shortDescription="Refreshes the containing page after the deployment dialog closes." />
  <cc:attribute name="update" default="" type="java.lang.String" />
</cc:interface>
<cc:implementation>
  <p:dialog style="margin-left: 120px; min-width: 550px; max-width: 700px;" header="#{ivy.cm.co('/deployment/DeployToApp')} '#{deploymentBean.appName} (v#{deploymentBean.appVersion})'"
    id="fileUploadModal" resizable="false" widgetVar="fileUploadModal" modal="true" responsive="true"
    closeOnEscape="true">
    <p:ajax event="close" listener="#{deploymentBean.onDialogClose}" />
    <p:ajax event="close" listener="#{cc.attrs.onClose}" update="fileUploadForm fileUploadResponse #{cc.attrs.update}" />
    <h:form id="fileUploadForm" enctype="multipart/form-data">
      <p:messages id="deploymentMessages" showDetail="true" closable="true">
        <p:autoUpdate />
      </p:messages>
      <h:panelGroup rendered="#{!deploymentBean.showDeployLogs}" layout="block">
        <p:staticMessage id="redeploymentWarning" severity="warn" styleClass="w-full mb-3"
          detail="#{ivy.cm.co('/deployment/RedeploymentWarning')}" rendered="#{deploymentBean.applicationRestartRequired}" />
        <div class="file-upload ui-fluid">
          <p:fileUpload id="fileUpload" value="#{deploymentBean.file}" dropZone="drop_zone" style="display: none" mode="advanced" auto="true"
            widgetVar="deployUpload" update="@form" accept="#{deploymentBean.allowedExtensionsText}" />
          <p:panelGrid columns="2" columnClasses="col-4, col-8" layout="flex">
            <p:button id="chooseFileBtn" icon="ti ti-plus" onclick="PF('deployUpload').show(); return false" value="#{ivy.cm.co('/fileUpload/ChooseFileButton')}"/>
            <h:panelGroup id="drop_zone" styleClass="drop-zone flex">
              <h:outputText value="#{deploymentBean.dropZoneText}"/>
            </h:panelGroup>
          </p:panelGrid>
        </div>
  
        <div class="ui-fluid">
          <p:panelGrid id="deployOptionsPanel" columns="2" columnClasses="col-4, col-8" layout="flex" contentStyleClass="align-items-center"
            styleClass="grey-label-panel mt-1 p-2 w-full">
            <p:outputLabel value="#{ivy.cm.co('/deployment/DeployTestUsers')}" for="deployTestUsers" />
            <h:panelGroup>
              <p:selectOneMenu value="#{deploymentBean.deployOptions.deployTestUsers}" widgetVar="deployTestUsers" id="deployTestUsers">
                <p:ajax event="valueChange" />
                <f:selectItems value="#{deploymentBean.deployOptions.deployTestUsersValues}" var="testUser"
                  itemLabel="#{testUser}" itemValue="#{testUser}"
                  itemDescription="#{ivy.cm.co('/deployment/testUsers/'.concat(testUser.name()))}" />
              </p:selectOneMenu>
              <small class="flex align-items-center gap-1">
                #{ivy.cm.co('/deployment/TestUsersDescription')}
                <p:link id="testUsersHelp" styleClass="inline-flex align-items-center" title="#{ivy.cm.co('/common/Help')}"
                  href="#{advisorBean.engineGuideBaseUrl}/deployment/prepare/deployment-options/index.html" target="_blank" rel="noopener noreferrer">
                  <f:passThroughAttribute name="aria-label" value="#{ivy.cm.co('/common/Help')}" />
                  <i class="ti ti-help-circle" style="font-size: 1.1rem"></i>
                </p:link>
                <p:tooltip for="testUsersHelp" position="top" showEvent="mouseenter focus" hideEvent="mouseleave blur">
                  <ui:repeat value="#{deploymentBean.deployOptions.deployTestUsersValues}" var="testUser">
                    <div>#{testUser}: #{ivy.cm.co('/deployment/testUsers/'.concat(testUser.name()))}</div>
                  </ui:repeat>
                </p:tooltip>
              </small>
            </h:panelGroup>
          </p:panelGrid>
        </div>
        <div class="flex justify-content-end mt-4 pt-3" style="border-top-width: 1px; border-top-style: solid; border-color: #e5e7eb">
          <p:commandButton id="cancelDeploymentBtn" onclick="PF('fileUploadModal').hide();" value="#{ivy.cm.co('/common/Cancel')}"
            type="button" styleClass="ui-button-secondary ui-button-outlined mr-2" />
          <p:commandButton id="uploadBtn" icon="ti ti-upload" value="#{ivy.cm.co('/deployment/Deploy')}" 
            actionListener="#{deploymentBean.uploadAndDeploy}" disabled="#{!deploymentBean.isFileSet()}"
            update=":#{cc.clientId}:fileUploadResponse :#{cc.clientId}:fileUploadForm"/>
        </div>
      </h:panelGroup>
    </h:form>
    <h:panelGroup id="fileUploadResponse" layout="block">
      <h:panelGroup rendered="#{deploymentBean.showDeployLogs}">
        <h:panelGroup id="uploadStatus" layout="block" styleClass="deploy-status #{deploymentBean.status.styleClass}">
          <i class="#{deploymentBean.status.iconClass}"></i>
          <h:outputText value="#{deploymentBean.status.text}"/>
        </h:panelGroup>
        <pre id="uploadLog" class="upload-log">
          <h:outputText value="#{deploymentBean.logs}"/>
        </pre>
        <div class="flex flex-row-reverse">
          <p:commandButton id="closeDeploymentBtn" onclick="PF('fileUploadModal').hide();" value="#{ivy.cm.co('/common/Close')}"
            icon="ti ti-circle-minus" styleClass="modal-input-button" />
          <p:commandButton id="backBtn" value="#{ivy.cm.co('/common/Back')}" icon="ti ti-circle-arrow-left"
            styleClass="ui-button-secondary ui-button-flat modal-input-button" actionListener="#{deploymentBean.hideDeployLogs}"
            update=":#{cc.clientId}:fileUploadResponse :#{cc.clientId}:fileUploadForm"/>
        </div>
      </h:panelGroup>
    </h:panelGroup>
  </p:dialog>
  </cc:implementation>

</html>
