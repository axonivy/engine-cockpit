<html xmlns="http://www.w3.org/1999/xhtml" xmlns:f="jakarta.faces.core" xmlns:h="jakarta.faces.html"
  xmlns:ui="jakarta.faces.facelets" xmlns:c="jakarta.tags.core" xmlns:ic="http://ivyteam.ch/jsf/component"
  xmlns:p="primefaces" xmlns:pe="primefaces.extensions" xmlns:cc="jakarta.faces.composite"
  xmlns:ccc="jakarta.faces.composite/composite">

<cc:interface>
  <cc:attribute name="bean" type="ch.ivyteam.enginecockpit.application.ApplicationBean" required="true" />
</cc:interface>

<cc:implementation>
  <p:growl for="applicationMessage" id="applicationMessage" showDetail="true" />
  <div class="card mb-3">
    <div class="flex align-items-center mb-3">
      <i class="pr-2 ti ti-packages card-icon"></i>
      <h6 class="m-0">#{ivy.cm.co('/application/Versions')}</h6>
      <p:commandButton id="createVersion" icon="ti ti-plus" value="#{ivy.cm.co('/common/Add')}" styleClass="ml-auto ui-button-primary"
        process="@this" actionListener="#{cc.attrs.bean.createVersion}" update="versionsForm:versionsTable" />
    </div>
    <h:form id="versionsForm" onkeypress="if (event.keyCode == 13) return false;">
      <p:dataTable id="versionsTable" value="#{cc.attrs.bean.applicationVersions}" var="version" rowIndexVar="idx"
        lazy="true" paginator="true" rows="10" paginatorPosition="bottom" paginatorAlwaysVisible="false"
        widgetVar="versionsTable" styleClass="ui-fluid" emptyMessage="#{ivy.cm.co('/common/NoRecordsFound')}">
        <f:facet name="header">
          <div class="ui-input-icon-left filter-container">
            <i class="ti ti-search" />
            <p:inputText id="globalFilter" onkeyup="PF('versionsTable').filter()"
              placeholder="#{ivy.cm.co('/common/SearchPlaceholder')}" value="#{cc.attrs.bean.nameFilter}" />
          </div>
        </f:facet>
        <p:column headerText="#{ivy.cm.co('/common/Version')}" filterBy="#{version.version}">
          <h:outputLink value="#{version.link}">
            <i class="ti ti-packages table-icon" />
            <h:outputText value="#{version.version}" />
          </h:outputLink>
        </p:column>

        <p:column headerText="#{ivy.cm.co('/projectDetail/ReleaseState')}" style="text-align:center;width:110px">
          <h:panelGroup id="releaseState" layout="block">
            <div class="#{version.state.releaseStateStyleClass}">
              <i class="#{version.state.releaseStateIcon}" title="#{version.state.releaseStateLabel}"></i>
              <h:outputText value="#{version.state.releaseStateLabel}" />
            </div>
          </h:panelGroup>
        </p:column>

        <p:column headerText="#{ivy.cm.co('/projectDetail/ActivityState')}" style="text-align:center;width:110px">
          <h:panelGroup id="activityState" layout="block">
            <div class="#{version.state.activityStateStyleClass}">
              <i class="#{version.state.activityStateIcon}" title="#{version.state.activityStateLabel}"></i>
              <h:outputText value="#{version.state.activityStateLabel}" />
            </div>
          </h:panelGroup>
        </p:column>

        <p:column headerText="#{ivy.cm.co('/projectDetail/OperationState')}" style="text-align:center;width:110px">
          <h:panelGroup id="operationState" layout="block" styleClass="#{version.state.activityStateStyleClass}">
            <i class="#{version.state.operationStateIcon}" title="#{version.state.operationStateLabel}"></i>
            <h:outputText value="#{version.state.operationStateLabel}" />
            <p:tooltip for="operationState" value="#{version.state.errorMessage}"
              rendered="#{not empty version.state.errorMessage}" styleClass="pre-tooltip" position="top" />
          </h:panelGroup>
        </p:column>

        <p:column headerText="#{ivy.cm.co('/projectDetail/OpenCases')}" style="text-align:center;width:100px">
          <h:panelGroup id="openCases" layout="block">
            <h:outputText value="#{version.openCases}" />
          </h:panelGroup>
        </p:column>

        <p:column headerText="#{ivy.cm.co('/projectDetail/DoneCases')}" style="text-align:center;width:100px">
          <h:panelGroup id="doneCases" layout="block">
            <h:outputText value="#{version.doneCases}" />
          </h:panelGroup>
        </p:column>

        <p:column style="text-align: center; width: 150px">
          <p:commandButton id="deployBtn" icon="ti ti-upload" title="#{ivy.cm.co('/common/Deployment')}"
            styleClass="ml-1 ui-button-primary rounded-button" process="@this"
            actionListener="#{deploymentBean.setAppNameAndVersion(cc.attrs.bean.securitySystem.securitySystemName, cc.attrs.bean.app, version.version)}"
            update=":deployPanel" oncomplete="PF('fileUploadModal').show();" />

          <p:commandButton id="activateBtn" icon="ti ti-player-play" title="#{ivy.cm.co('/common/Activate')}"
            disabled="#{not version.state.activatable}" styleClass="ml-1 ui-button-success rounded-button">
            <p:ajax listener="#{version.state.activate}" update="@form:versionsTable" />
          </p:commandButton>

          <p:commandButton id="deactivateBtn" icon="ti ti-player-stop" title="#{ivy.cm.co('/common/Deactivate')}"
            disabled="#{not version.state.deactivatable}" styleClass="ml-1 ui-button-danger rounded-button">
            <p:ajax listener="#{version.state.deactivate}" update="@form:versionsTable" />
          </p:commandButton>

          <p:commandButton title="#{ivy.cm.co('/common/More')}" id="tasksButton" type="button" icon="ti ti-menu-2"
            styleClass="ml-1 ui-button-secondary rounded-button ui-button-outlined" />

          <p:menu overlay="true" trigger="tasksButton" my="right top" at="right bottom" id="activityMenu">
            <p:menuitem id="releaseBtn" value="#{ivy.cm.co('/applications/ReleaseButtonTitle')}" icon="ti ti-crane"
              disabled="#{not version.state.releasable}" actionListener="#{version.state.release}"
              update="@form:versionsTable" />
            <p:menuitem id="deprecateBtn" value="#{ivy.cm.co('/application/Deprecate')}" disabled="#{not version.state.deprecatable}"
              icon="ti ti-circle-half-vertical" actionListener="#{version.state.deprecate}"
              update="@form:versionsTable" />
            <p:menuitem id="archiveBtn" value="#{ivy.cm.co('/application/Archive')}" disabled="#{not version.state.archiveable}" icon="ti ti-archive"
              actionListener="#{version.state.archive}" update="@form:versionsTable" />
            <p:divider />
            <p:menuitem id="convertBtn" disabled="#{not version.canConvert()}" value="#{ivy.cm.co('/application/Convert')}" icon="ti ti-refresh"
              onclick="PF('convertDialog_#{version.version}').show();" />
            <p:divider />
            <p:menuitem id="deleteBtn" value="#{ivy.cm.co('/common/Delete')}" icon="ti ti-trash"
              update="@form:deleteVersionDialog" actionListener="#{applicationBean.prepareDelete(version)}"
              process="@this" style="pointer-events: all"
              oncomplete="PF('deleteVersionDialog').show(); return false;" />
          </p:menu>
          <p:confirmDialog id="convertDialog" widgetVar="convertDialog_#{version.version}"
              header="#{ivy.cm.co('/application/Convert')} '#{version.name}'" severity="alert"
              responsive="true" width="600">
            <f:facet name="message">
              <p>
                <h:outputText value="#{ivy.cm.co('/applications/ApplicationConvertToLatestVersionMessage')}"/>
              </p>
              <p:scrollPanel mode="native" style="height: 300px; width: 100%;">
                <h:panelGroup id="conversionLog">
                  <div style="padding: 5px;">
                    <pre style="white-space: pre-wrap; margin:0px;"><code>#{version.appConversionLog}</code></pre>
                  </div>
                </h:panelGroup>
              </p:scrollPanel>
            </f:facet>
            <p:commandButton id="convertConfirmYesBtn" widgetVar="convertConfirmYesBtn_#{version.version}"
              value="#{ivy.cm.co('/application/Convert')}" styleClass="modal-input-button"
              disabled="#{not version.canConvert()}" process="@this" immediate="true"
              actionListener="#{version.convert}" update="conversionLog convertConfirmYesBtn"
              oncomplete="PF('convertConfirmYesBtn_#{version.version}').disable();PF('convertFinishBtn_#{version.version}').enable();"
              icon="si si-button-refresh-arrows" />
            <p:commandButton id="convertFinishBtn" widgetVar="convertFinishBtn_#{version.version}"
              value="#{ivy.cm.co('/common/Finish')}" styleClass="modal-input-button" disabled="true"
              oncomplete="PF('convertDialog_#{version.version}').hide();reloadTree();"
              icon="si si-check-circle-1" />
          </p:confirmDialog>
        </p:column>
      </p:dataTable>

      <p:confirmDialog id="deleteVersionDialog"
        message="#{ivy.cm.content('/application/DeleteVersionDialogMessage')
          .replace('name', applicationBean.deleteApplication.name)
          .replace('version', applicationBean.deleteApplication.version)
          .get()}"
        header="#{ivy.cm.content('/application/DeleteVersionDialogHeader')
          .replace('name', applicationBean.deleteApplication.name)
          .replace('version', applicationBean.deleteApplication.version)
          .get()}"
        severity="alert" widgetVar="deleteVersionDialog">
        <p:staticMessage severity="#{applicationBean.deleteApplication.existingCasesSeverity}"
          detail="#{applicationBean.deleteApplication.existingCasesMessage}" />
        <p:staticMessage severity="warn" rendered="#{applicationBean.deleteApplication.lastVersion}"
          detail="#{applicationBean.deleteApplication.lastVersionMessage}" />
        <p:commandButton value="#{ivy.cm.co('/common/Cancel')}" onclick="PF('deleteVersionDialog').hide();"
          type="button" styleClass="ui-button-secondary ui-button-flat modal-input-button" />
        <p:commandButton id="deleteVersionDialogConfirmYesBtn" value="#{ivy.cm.co('/common/Delete')}" immediate="true"
          actionListener="#{applicationBean.deleteSelectedApplicationVersion()}"
          onclick="PF('deleteVersionDialog').hide();" update="@form:versionsTable" icon="ti ti-trash"
          styleClass="modal-input-button" />
      </p:confirmDialog>
    </h:form>
  </div>
</cc:implementation>

</html>
